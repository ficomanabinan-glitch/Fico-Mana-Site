name: Security and build verification

on:
  pull_request:
  push:
    branches: [main, codex/editor-production]
  schedule:
    - cron: '15 0 * * 1'

permissions:
  contents: read

jobs:
  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      SUPABASE_SECRET_KEY: ci-only-supabase-server-key
      PORTAL_SIGNING_SECRET: ci-only-portal-signing-secret-32-bytes-minimum
      SECURITY_HASH_SECRET: ci-only-rate-hash-secret-32-bytes-minimum
      GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-not-a-real-secret
      GOOGLE_TOKEN_ENCRYPTION_KEY: ci-only-drive-encryption-key-32-bytes-minimum
      GOOGLE_OAUTH_STATE_SECRET: ci-only-oauth-state-secret-32-bytes-minimum
      GOOGLE_DRIVE_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_only_not_a_real_credential
      NEXT_PUBLIC_STAGING_ADMIN_EMAIL: ''
      NEXT_PUBLIC_STAGING_ADMIN_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm security:check
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm security:http

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          retention-days: 14
